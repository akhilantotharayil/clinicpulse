name: ClinicPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Flask Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -v

  docker-build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ClinicPulse image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: clinicpulse:ci

      - name: Start ClinicPulse container
        run: |
          docker run -d \
            --name clinicpulse-test \
            -p 127.0.0.1:8000:8000 \
            clinicpulse:ci

      - name: Verify application health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo ""
              echo "ClinicPulse smoke test PASSED"
              exit 0
            fi

            echo "Waiting for ClinicPulse to start..."
            sleep 2
          done

          echo "ClinicPulse smoke test FAILED"
          docker logs clinicpulse-test
          exit 1

      - name: Save tested Docker image
        run: |
          docker save clinicpulse:ci | gzip > clinicpulse-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinicpulse-image
          path: clinicpulse-image.tar.gz
          retention-days: 1

      - name: Clean up container
        if: always()
        run: docker rm -f clinicpulse-test || true

  docker-push:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download tested Docker image
        uses: actions/download-artifact@v4
        with:
          name: clinicpulse-image

      - name: Load Docker image
        run: |
          docker load -i clinicpulse-image.tar.gz

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          docker tag clinicpulse:ci akhilanto/clinicpulse:${{ github.sha }}
          docker tag clinicpulse:ci akhilanto/clinicpulse:latest

          docker push akhilanto/clinicpulse:${{ github.sha }}
          docker push akhilanto/clinicpulse:latest
