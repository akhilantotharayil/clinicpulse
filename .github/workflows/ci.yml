name: ClinicPulse CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Flask Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -v

  docker-build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ClinicPulse image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: clinicpulse:ci

      - name: Start ClinicPulse container
        run: |
          docker run -d \
            --name clinicpulse-test \
            -p 127.0.0.1:8000:8000 \
            clinicpulse:ci

      - name: Verify application health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo ""
              echo "ClinicPulse smoke test PASSED"
              exit 0
            fi

            echo "Waiting for ClinicPulse to start..."
            sleep 2
          done

          echo "ClinicPulse smoke test FAILED"
          docker logs clinicpulse-test
          exit 1

      - name: Save tested Docker image
        run: |
          docker save clinicpulse:ci | gzip > clinicpulse-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinicpulse-image
          path: clinicpulse-image.tar.gz
          retention-days: 1

      - name: Clean up container
        if: always()
        run: docker rm -f clinicpulse-test || true

  docker-push:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download tested Docker image
        uses: actions/download-artifact@v4
        with:
          name: clinicpulse-image

      - name: Load Docker image
        run: |
          docker load -i clinicpulse-image.tar.gz

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          docker tag clinicpulse:ci akhilanto/clinicpulse:${{ github.sha }}
          docker tag clinicpulse:ci akhilanto/clinicpulse:latest

          docker push akhilanto/clinicpulse:${{ github.sha }}
          docker push akhilanto/clinicpulse:latest

  deploy-to-aws:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify AWS role configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "ERROR: AWS_ROLE_ARN is empty or unavailable"
            exit 1
          fi
          echo "AWS_ROLE_ARN is available"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Create Elastic Beanstalk deployment package
        run: |
          mkdir -p deployment

          cat > deployment/Dockerrun.aws.json <<'DOCKER_EOF'
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "akhilanto/clinicpulse:${{ github.sha }}"
            },
            "Ports": [
              {
                "ContainerPort": "8000"
              }
            ]
          }
          DOCKER_EOF

          cd deployment
          zip -q ../clinicpulse-deploy.zip Dockerrun.aws.json

      - name: Upload deployment package to S3
        run: |
          aws s3 cp clinicpulse-deploy.zip \
            s3://elasticbeanstalk-us-east-1-216325673272/clinicpulse-deployments/${{ github.sha }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name clinicpulse \
            --version-label "clinicpulse-${{ github.sha }}" \
            --source-bundle S3Bucket=elasticbeanstalk-us-east-1-216325673272,S3Key=clinicpulse-deployments/${{ github.sha }}.zip \
            --region us-east-1

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name clinicpulse-blue \
            --version-label "clinicpulse-${{ github.sha }}" \
            --region us-east-1

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names clinicpulse-blue \
            --region us-east-1

      - name: Verify deployment
        run: |
          set -euo pipefail

          EXPECTED_VERSION="clinicpulse-${{ github.sha }}"

          read -r STATUS HEALTH VERSION <<< "$(aws elasticbeanstalk describe-environments \
            --environment-names clinicpulse-blue \
            --query 'Environments[0].[Status,Health,VersionLabel]' \
            --output text \
            --region us-east-1)"

          echo "Environment status: $STATUS"
          echo "Environment health: $HEALTH"
          echo "Deployed version: $VERSION"

          if [ "$STATUS" != "Ready" ] || [ "$HEALTH" != "Green" ] || [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Deployment verification failed"
            exit 1
          fi

          echo "ClinicPulse deployment verified successfully"
