name: ClinicPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Flask Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -v

  docker-build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ClinicPulse image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: clinicpulse:ci

      - name: Start ClinicPulse container
        run: |
          docker run -d \
            --name clinicpulse-test \
            -p 127.0.0.1:8000:8000 \
            clinicpulse:ci

      - name: Verify application health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo ""
              echo "ClinicPulse smoke test PASSED"
              exit 0
            fi

            echo "Waiting for ClinicPulse to start..."
            sleep 2
          done

          echo "ClinicPulse smoke test FAILED"
          docker logs clinicpulse-test
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm -f clinicpulse-test || true
